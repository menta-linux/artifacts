name: accept
# Serialized acceptance of ONE committed build manifest into the channel its target feeds. Never touches stable.
run-name: accept ${{ inputs.build_id }}
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Build id (sha256:<64 hex>) of a manifest already committed under builds/"
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: artifacts-state
  cancel-in-progress: false
jobs:
  accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BUILD_ID: ${{ inputs.build_id }}
    steps:
      - name: Validate the identifier before using it anywhere
        run: '[[ "$BUILD_ID" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad build_id"; exit 2; }'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: menta-linux/orchestrator
          ref: 112b9dd371769ec14742de7997b36ab8995eb3a8
          path: orchestrator
          persist-credentials: false
      - name: Install tooling (distribution packages only)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-debian python3-jsonschema python3-cryptography python3-yaml python3-apt dose-builddebcheck dose-extra gnupg gpgv debian-archive-keyring git
      - name: Current Debian archive keyring (the runner's predates the trixie signing keys; pinned by SHA-256)
        run: |
          curl --fail --silent --show-error --location --proto '=https,http' -o "$RUNNER_TEMP/dak.deb" http://deb.debian.org/debian/pool/main/d/debian-archive-keyring/debian-archive-keyring_2025.1_all.deb
          echo "9ea7778e443144ca490668737a8ab22dd3e748bb99e805e22ec055abeb3c7fac  $RUNNER_TEMP/dak.deb" | sha256sum --check --strict
          sudo dpkg -i "$RUNNER_TEMP/dak.deb"
      - name: Accept (validates the exact candidate snapshot, then moves the pointer with compare-and-swap)
        run: |
          cd orchestrator
          PYTHONPATH=src python3 -m menta_ci.cli accept --artifacts "$GITHUB_WORKSPACE" --build "$BUILD_ID" --cache "$RUNNER_TEMP/assets" --actor "$GITHUB_ACTOR"
      - name: Commit the pointer move (CI bot identity; retried against concurrent pushes)
        run: |
          git config user.name "menta-ci"
          git config user.email "menta-ci@users.noreply.github.com"
          git add channels.json snapshots history.jsonl builds
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -q -m "accept ${BUILD_ID:0:19}"
          for i in 1 2 3 4 5; do git push && exit 0; git pull --rebase -q; done; exit 1
